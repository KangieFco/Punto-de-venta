services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-pos
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Admin123++"
    ports:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  backend:
    build:
      context: .
      dockerfile: PosApi/src/PosApi/Dockerfile
    container_name: pos-backend
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_URLS: "http://+:5227"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PosDb;User Id=sa;Password=Admin123++;TrustServerCertificate=True;MultipleActiveResultSets=True;"
      Jwt__Key: "ESTA_ES_UNA_CLAVE_SUPER_SECRETA_DE_MINIMO_32_CARACTERES"
      Jwt__Issuer: "PosApi"
      Jwt__Audience: "PosClient"
      Jwt__ExpirationHours: "8"
    expose:
      - "5227"

  frontend:
    build:
      context: ./pos-client
      dockerfile: Dockerfile
    container_name: pos-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sqlserver_data: