server {
    listen 80;
    server_name minerospos.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name minerospos.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/minerospos.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minerospos.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend:5227/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /images/ {
        proxy_pass http://backend:5227/images/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}